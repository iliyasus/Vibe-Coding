{% extends "base.html" %}
{% block title %}Смена пароля — MineShield{% endblock %}
{% block content %}
<section class="page-hero">
  <a class="back-link" href="{{ url_for('home') }}">← На главную</a>
  <p class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</p>
  <h1>Сменить <span>пароль</span></h1>
</section>
<section class="form-panel auth-panel">
  <form class="site-form" action="{{ url_for('change_password') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Текущий пароль
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label>Новый пароль
      <input type="password" name="new_password" required minlength="8" maxlength="128" autocomplete="new-password">
    </label>
    <label>Повторите новый пароль
      <input type="password" name="confirmation" required minlength="8" maxlength="128" autocomplete="new-password">
    </label>
    <button class="button button-primary" type="submit">Сохранить новый пароль</button>
  </form>
</section>
{% endblock %}
